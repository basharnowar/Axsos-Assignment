<body>
    <h1>Choose Color</h1>
    <button onclick="chooseColor(this)" onmouseover="previewColor(this)" onmouseout="clearPreview()">Blue</button>
    <button onclick="chooseColor(this)" onmouseover="previewColor(this)" onmouseout="clearPreview()">Green</button>
    <button onclick="chooseColor(this)" onmouseover="previewColor(this)" onmouseout="clearPreview()">Red</button>

    <p id="message">No color selected yet.</p>
    <p id="preview">Hover over a button to preview a color.</p>

</body>
